[package]
name = "fluxus-arduino"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
description = "Fluxus: a user-friendly terminal UI for Arduino development over arduino-cli"
repository = "https://github.com/jesodium/fluxus-arduino"
keywords = ["arduino", "tui", "ratatui", "embedded", "cli"]
categories = ["command-line-utilities", "embedded"]

[[bin]]
name = "fluxus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
